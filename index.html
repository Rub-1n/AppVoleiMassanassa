<style>
:root{--bg:#f4f3ef;--card:#fff;--ink:#0c1730;--mute:#667085;--line:#d8d6cf;--red:#d3202e;--redsoft:#f9e3e5;--onred:#fff;--navy:#0c1730;box-sizing:border-box}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111a2c;--ink:#eef1f7;--mute:#8b95a8;--line:#243350;--red:#ff5560;--redsoft:#3a1a22;--onred:#0b1220;--navy:#050a14}
:root[data-skin="azul"]:not([data-theme="light"]){--red:#6b92f5;--redsoft:#16264a}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111a2c;--ink:#eef1f7;--mute:#8b95a8;--line:#243350;--red:#ff5560;--redsoft:#3a1a22;--onred:#0b1220;--navy:#050a14}
:root[data-skin="azul"][data-theme="dark"]{--red:#6b92f5;--redsoft:#16264a}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;max-width:560px;margin:0 auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,.nk,.nbig,.nvs,.chip,.md,.mi b,th,.res b,.dn,.pl b,.ci span,.aviso b,label,.btn,nav button,figcaption{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
#hero{position:relative;min-height:280px;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 22px;background:var(--navy) center/cover;color:#fff}
.skins{display:flex;gap:8px;align-self:flex-end}
.skins button{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.75);cursor:pointer;padding:0}
.skins button[data-s="azul"]{background:linear-gradient(135deg,#1747b5 50%,#fff 50%)}
.skins button[data-s="rojo"]{background:linear-gradient(135deg,#d3202e 50%,#fff 50%)}
.skins button[aria-pressed="true"]{outline:2px solid #fff;outline-offset:2px}
.hcopy{margin-top:auto}
#cat{font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:6px}
#club{font-size:46px;font-weight:800;line-height:.95;text-transform:uppercase}
section{display:none;padding:0 20px 24px}section.on{display:block}
h2{font-size:14px;font-weight:700;line-height:1;letter-spacing:.16em;text-transform:uppercase;margin:28px 0 12px;padding-top:12px;border-top:2px solid var(--ink)}
.next{background:var(--navy);color:#fff;padding:22px 20px;margin:0 -20px;border-bottom:4px solid var(--red)}
.nk{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.nbig{font-size:34px;font-weight:800;line-height:1;text-transform:uppercase;margin:8px 0 4px;display:flex;align-items:baseline;gap:12px}
.nbig span{opacity:.65}
.nvs{font-size:28px;font-weight:800;line-height:1.05;text-transform:uppercase}
.nmeta{margin-top:12px;font-size:14px;color:rgba(255,255,255,.8);display:flex;gap:10px;align-items:center}
.chip{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red);color:var(--onred);padding:3px 8px;font-style:normal;white-space:nowrap}
.chip.out{background:transparent;border:1px solid currentColor;color:var(--mute);padding:2px 7px}
.next .chip{background:#fff;color:var(--navy)}.next .chip.out{background:transparent;color:#fff}
.mt{display:grid;grid-template-columns:54px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.md{text-align:center;border:1px solid var(--ink)}
.md b{display:block;font-size:26px;font-weight:800;line-height:1.1;padding-top:3px}
.md span{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:2px 0}
.mi b{display:block;font-size:20px;font-weight:700;line-height:1.1;text-transform:uppercase}
.mi span{font-size:13px;color:var(--mute)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px;border-bottom:2px solid var(--ink)}
td{padding:10px 8px;border-bottom:1px solid var(--line)}
td:first-child{width:32px;font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;color:var(--mute)}
th:nth-child(n+3),td:nth-child(n+3){text-align:right}
td:nth-child(n+3){font-family:"Barlow Condensed",sans-serif;font-size:18px;font-weight:700}
tr.me td{background:var(--redsoft);font-weight:700}tr.me td:first-child{box-shadow:inset 4px 0 0 var(--red);color:var(--ink)}
.res{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.res b{font-size:21px;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.pl{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.dn{font-size:36px;font-weight:800;line-height:1;color:var(--red);width:46px;text-align:center}
.pl div b{display:block;font-size:20px;font-weight:700;text-transform:uppercase}.pl span{font-size:13px;color:var(--mute)}
.ci{padding:12px 0;border-bottom:1px solid var(--line)}
.ci span{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ci b{font-size:16px;font-weight:600}
.aviso{border-left:4px solid var(--red);background:var(--redsoft);padding:12px 14px;margin:16px 0}
.aviso b{font-size:19px;font-weight:700;text-transform:uppercase}.aviso small{display:block;color:var(--mute);margin-top:4px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:0 -20px}
.gal figure{margin:0;position:relative;aspect-ratio:1;background:var(--line);cursor:pointer;overflow:hidden}
.gal figure:first-child{grid-column:1/-1;aspect-ratio:16/10}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.gal figcaption{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;color:#fff;font-size:14px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.7))}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
#tabs{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;border-top:3px solid transparent;background:none;color:var(--mute);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 0 9px;cursor:pointer}
nav button[hidden]{display:none}
nav button.on{color:var(--ink);border-top-color:var(--red)}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;pointer-events:none}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.ed{display:grid;gap:6px;border:1px solid var(--line);background:var(--card);padding:12px;margin-bottom:10px}
input:not([type=checkbox]){width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--ink)}
label{display:grid;gap:4px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
label.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13px}
.btn{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:10px 16px;cursor:pointer;border-radius:0}
.btn.red{background:var(--red);border-color:var(--red);color:var(--onred)}
.sticky{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px 0;background:var(--bg)}
dialog{border:1px solid var(--ink);border-radius:0;background:var(--card);color:var(--ink);padding:20px;width:min(340px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.lock{margin-top:28px;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}
.vacio{color:var(--mute);padding:12px 0}.aviso:first-child{margin-top:0}
.go{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--red);border:1px solid currentColor;padding:4px 10px;white-space:nowrap}
.nmeta .go{margin-left:auto;color:#fff}.nmeta span{min-width:0}
.mi .go{display:table;margin-top:6px;padding:3px 8px}
</style>
</head>

const app=initializeApp({apiKey:"AIzaSyBqUQUGyqpBXz1wxUrmH8iAdjewXjRK8No",authDomain:"appvolei-1ae10.firebaseapp.com",projectId:"appvolei-1ae10",storageBucket:"appvolei-1ae10.firebasestorage.app",messagingSenderId:"129714548184",appId:"1:129714548184:web:380feaa37a43f4ccd656ad"});

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const DEF={"club": "EEMM Massanassa Voleibol", "cat": "JDM Cadete Valencia · Grupo Cadete Rubi · 2026/27", "partidos": [{"rival": "IES Patraix", "fecha": "Vie 13 nov", "hora": "18:00", "casa": false, "lugar": "IES Patraix - Vicenta Ferrer", "iso": "2026-11-13"}, {"rival": "FLS Plata", "fecha": "Vie 20 nov", "hora": "19:30", "casa": false, "lugar": "IES Fuente San Luis (P. exterior)", "iso": "2026-11-20"}, {"rival": "IES Juan de Garay", "fecha": "Sáb 28 nov", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": "2026-11-28"}, {"rival": "IES San Vicente Ferrer", "fecha": "Vie 11 dic", "hora": "17:00", "casa": false, "lugar": "IES Sant Vicent Ferrer (Valencia)", "iso": "2026-12-11"}, {"rival": "Voleibol Sorolla Rojo", "fecha": "Sáb 19 dic", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": "2026-12-19"}, {"rival": "Sispersis Almussafes", "fecha": "Sáb 9 ene", "hora": "12:00", "casa": false, "lugar": "Pab. mun. de Almussafes", "iso": "2027-01-09"}, {"rival": "APVS Phoenix CAD", "fecha": "Vie 15 ene", "hora": "18:00", "casa": false, "lugar": "C.P. El Pati (Silla)", "iso": "2027-01-15"}, {"rival": "IES Patraix", "fecha": "Sáb 23 ene", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": "2027-01-23"}, {"rival": "FLS Plata", "fecha": "Sáb 30 ene", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": "2027-01-30"}, {"rival": "IES Juan de Garay", "fecha": "Vie 5 feb", "hora": "17:30", "casa": false, "lugar": "IES Juan de Garay (Valencia)", "iso": "2027-02-05"}, {"rival": "IES San Vicente Ferrer", "fecha": "Sáb 13 feb", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": "2027-02-13"}, {"rival": "Voleibol Sorolla Rojo", "fecha": "Vie 19 feb", "hora": "19:30", "casa": false, "lugar": "Colegio Sorolla (P. ext.)", "iso": "2027-02-19"}, {"rival": "Sispersis Almussafes", "fecha": "Sáb 27 feb", "hora": "12:00", "casa": true, "lugar": "Polideportivo Massanassa", "iso": " let D=structuredClone(DEF),admin=false;

 $("club").textContent=D.club;$("cat").textContent=D.cat;document.title=D.club;
 const up=D.partidos.filter(m=>when(m)+72e5>Date.now()).sort((a,b)=>when(a)===when(b)?0:when(a)-when(b)),p=up[0];

 const av=a=>`<div class="aviso"><b>${esc(a.titulo)}</b><br>${esc(a.texto)}<small>${esc(a.fecha)}</small></div>`,la=[...D.avisos].reverse();

 }

 `<div class="sticky"><button class="btn red" id="save">Guardar cambios</button><button class="btn" id="out">Salir</button></div><p id="msg" style="font-size:13px;color:var(--mute)"></p>`;

$("gal").innerHTML=FOTOS.map((f,i)=>`<figure data-i="${i}"><img src="${f[1]}" alt="${f[0]}" loading="lazy"><figcaption>${f[0]}</figcaption></figure>`).join("");
$("gal").onclick=e=>{const f=e.target.closest("figure");if(!f)return;const lb=$("lb");lb.querySelector("img").src=FOTOS[f.dataset.i][1];lb.classList.add("on")};
$("lb").onclick=()=>$("lb").classList.remove("on");
$("hero").style.backgroundImage="linear-gradient(180deg,rgba(12,23,48,.2),rgba(12,23,48,.88)),url("+FOTOS[0][1]+")";
function skin(s){document.documentElement.dataset.skin=s;document.querySelectorAll(".skins button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s==s));try{localStorage.setItem("skin",s)}catch(e){}}
let s0="azul";try{s0=localStorage.getItem("skin")||"azul"}catch(e){}
skin(s0);
document.querySelector(".skins").onclick=e=>{const b=e.target.closest("button");if(b)skin(b.dataset.s)};
let dp=null;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
let hidden=false;try{hidden=localStorage.getItem("instx")==="1"}catch(_){}
function bar(){const b=$("instbar");if(standalone||hidden){b.hidden=true;return}
 let t,btn="";
 if(ios)t="<b>Instala la app en tu iPhone</b><br>Ábrela en <b>Safari</b>, pulsa <b>Compartir</b> (el cuadrado con la flecha) y elige <b>Añadir a pantalla de inicio</b>.";
 else if(dp){t="<b>Instala la app</b><br>Tenla en tu pantalla de inicio, como cualquier otra app.";btn='<button class="btn red" id="instgo">Instalar app</button> '}
 else t="<b>Instala la app</b><br>En el menú del navegador (⋮) pulsa <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.";
 b.className="aviso";b.innerHTML=t+'<div style="margin-top:10px">'+btn+'<button class="btn" id="instx">Ahora no</button></div>';b.hidden=false}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;bar()});
addEventListener("appinstalled",()=>{$("instbar").hidden=true});
$("instbar").addEventListener("click",async e=>{const id=e.target.id;
 if(id=="instgo"&&dp){dp.prompt();await dp.userChoice;dp=null;$("instbar").hidden=true}
 else if(id=="instx"){hidden=true;try{localStorage.setItem("instx","1")}catch(_){}$("instbar").hidden=true}});
bar();
</script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
